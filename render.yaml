# ============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# ============================================================================
# Deploy both Lumina Frontend and Backend services automatically on Render.
# Documentation: https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # 1. LUMINA BACKEND (Node.js Express + Groq AI Service)
  # --------------------------------------------------------------------------
  - type: web
    name: lumina-backend
    env: node
    plan: free
    rootDir: Lumina-main/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: GROQ_API_KEY
        sync: false # Set securely in Render dashboard
      - key: FRONTEND_URL
        value: https://lumina-frontend.onrender.com

  # --------------------------------------------------------------------------
  # 2. LUMINA FRONTEND (Vite React Single Page Application)
  # --------------------------------------------------------------------------
  - type: web
    name: lumina-frontend
    env: static
    plan: free
    rootDir: Lumina-main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lumina-backend
          property: host
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
